name: Wiki QA

on:
  pull_request:

permissions:
  contents: read

jobs:
  wiki-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Check patch formatting
        run: git diff --check origin/${{ github.base_ref }}...HEAD
      - name: Check public Markdown and links
        run: python3 scripts/wiki_qa.py
      - name: Check public screenshots
        run: python3 scripts/screenshot_quality_check.py
