name: Wiki QA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  wiki-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependencies
        run: python -m pip install jsonschema Pillow
      - name: Check patch formatting
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref }}...HEAD
      - name: Check pushed commit formatting
        if: github.event_name == 'push'
        run: git show --check --format= HEAD
      - name: Check public Markdown and links
        run: python3 scripts/wiki_qa.py
      - name: Test metadata guardrails
        run: python3 -m unittest scripts/test_support_qa.py
      - name: Check document and screenshot metadata
        run: python3 scripts/support_qa.py
      - name: Check public screenshots
        run: python3 scripts/screenshot_quality_check.py
